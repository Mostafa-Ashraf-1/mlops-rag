events {
    worker_connections 1024;
}

http {
    # 90/10 Canary Split between Stable (v1) and Candidate (v2)
    upstream rag_backend {
        server 127.0.0.1:3000 weight=10;  # Stable v1 (BentoML)
        server 127.0.0.1:8000 weight=0;  # Candidate v2 (FastAPI / New Retriever)
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://rag_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Traceable canary header for attribution
            add_header X-Canary-Status "active";
            add_header X-Serving-Cluster "legal-rag-canary-mesh";
        }

        # Shadow Mode (Mirroring live traffic without affecting user response)
        location /ask_shadow {
            proxy_pass http://127.0.0.1:3000;
            mirror /mirror_candidate;
        }

        location = /mirror_candidate {
            internal;
            proxy_pass http://127.0.0.1:8000;
        }
    }
}